<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim Paneli | Major Döner</title>
<link rel="icon" href="assets/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  /* Panel kendi sabit renklerini kullanır (--a-*). Sitenin marka renkleri yalnızca "Görünüm" önizlemesinde görünür. */
  :root { --a-bg:#12110f; --a-panel:#1c1a17; --a-panel2:#25221d; --a-line:#3a352d; --a-text:#f1e9d8; --a-muted:#a79f8d; --a-gold:#e0b65c; --a-ok:#58c27d; --a-bad:#ef6b5b; --a-warn:#f2a51d; color-scheme: dark; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--a-bg); color: var(--a-text); font: 400 16px/1.5 "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif; overflow-x: hidden; padding-bottom: env(safe-area-inset-bottom, 0px); }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--a-gold); }
  :focus-visible { outline: 3px solid var(--a-warn); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .ic { flex: none; }

  /* Giriş */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 18px; }
  .login form { width: 100%; max-width: 380px; background: var(--a-panel); border: 1px solid var(--a-line); border-radius: 14px; padding: 28px 24px; display: grid; gap: 16px; }
  .login img { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--a-gold); margin: 0 auto; object-fit: cover; }
  .login h1 { font: 700 1.6rem/1.2 "Barlow Condensed", sans-serif; text-align: center; letter-spacing: .02em; }
  .login .hint { text-align: center; color: var(--a-muted); font-size: .92rem; }

  /* Ortak form */
  label.f { display: grid; gap: 6px; font-weight: 500; font-size: .95rem; color: var(--a-muted); }
  label.f > span { color: var(--a-text); }
  input[type=text], input[type=password], input[type=number], input[type=date], input[type=url], input[type=search], select, textarea {
    width: 100%; min-height: 46px; padding: 10px 12px; background: var(--a-bg); border: 1px solid var(--a-line); border-radius: 8px; color: var(--a-text); }
  textarea { min-height: 110px; resize: vertical; line-height: 1.45; }
  input:focus, select:focus, textarea:focus { border-color: var(--a-gold); outline: none; box-shadow: 0 0 0 3px rgba(224,182,92,.25); }
  input[type=color] { width: 54px; height: 46px; padding: 3px; background: var(--a-bg); border: 1px solid var(--a-line); border-radius: 8px; cursor: pointer; }
  .help { font-size: .88rem; color: var(--a-muted); font-weight: 400; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--a-line); background: var(--a-panel2); color: var(--a-text); font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { border-color: var(--a-gold); }
  .btn.primary { background: var(--a-gold); border-color: var(--a-gold); color: #1a1405; }
  .btn.danger { color: var(--a-bad); border-color: color-mix(in srgb, var(--a-bad) 50%, var(--a-line)); }
  .btn.danger.arm { background: var(--a-bad); color: #fff; border-color: var(--a-bad); }
  .btn.sm { min-height: 36px; padding: 0 12px; font-size: .92rem; }
  .btn.icon { width: 36px; min-height: 36px; padding: 0; }
  .btn[disabled] { opacity: .4; pointer-events: none; }
  .err { color: var(--a-bad); font-size: .92rem; min-height: 1.2em; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
  .row > * { flex: 1 1 180px; min-width: 0; }
  .grid2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
  .grid3 { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
  .switch { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; font-weight: 500; }
  .switch input { width: 22px; height: 22px; accent-color: var(--a-gold); flex: none; }

  /* Kabuk */
  .shell { display: grid; min-height: 100vh; grid-template-columns: minmax(0, 1fr); }
  .side { background: var(--a-panel); border-bottom: 1px solid var(--a-line); padding-top: env(safe-area-inset-top, 0px); position: sticky; top: 0; z-index: 20; }
  .side-top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
  .side-top img { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--a-gold); object-fit: cover; }
  .side-top b { font: 700 1.2rem/1 "Barlow Condensed", sans-serif; letter-spacing: .03em; }
  .status { margin-left: auto; font-size: .9rem; color: var(--a-muted); display: flex; align-items: center; gap: 6px; }
  .status.ok { color: var(--a-ok); } .status.bad { color: var(--a-bad); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { all: unset; cursor: pointer; padding: 9px 14px; border-radius: 8px; white-space: nowrap; font-weight: 600; color: var(--a-muted); min-height: 24px; }
  .tabs button[aria-selected="true"] { background: var(--a-gold); color: #1a1405; }
  .tabs button:focus-visible { outline: 3px solid var(--a-warn); }
  .side-links { display: none; }
  main.pane { padding: 20px 16px 80px; max-width: 920px; width: 100%; min-width: 0; }
  .banner { background: color-mix(in srgb, var(--a-warn) 12%, var(--a-panel)); border: 1px solid color-mix(in srgb, var(--a-warn) 45%, var(--a-line)); border-radius: 10px; padding: 12px 14px; font-size: .94rem; margin-bottom: 18px; }
  .card { background: var(--a-panel); border: 1px solid var(--a-line); border-radius: 12px; padding: 20px; margin-bottom: 18px; display: grid; gap: 16px; }
  .card > h2 { font: 700 1.35rem/1.2 "Barlow Condensed", sans-serif; letter-spacing: .02em; }
  .card > h2 + .help { margin-top: -10px; }
  .pg-title { font: 700 1.9rem/1.1 "Barlow Condensed", sans-serif; margin-bottom: 16px; letter-spacing: .02em; }

  /* Görsel yükleme */
  .imgbox { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .imgbox .pv { width: 96px; height: 96px; border-radius: 10px; background: var(--a-bg); border: 1px solid var(--a-line); overflow: hidden; display: grid; place-items: center; color: var(--a-muted); font-size: .8rem; text-align: center; flex: none; }
  .imgbox .pv img { width: 100%; height: 100%; object-fit: cover; }
  .imgbox .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .file { position: relative; overflow: hidden; }
  .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

  /* Listeler */
  .list { display: grid; gap: 10px; }
  .li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--a-panel2); border: 1px solid var(--a-line); border-radius: 10px; padding: 12px; }
  .li.off { opacity: .6; }
  .li .t { min-width: 0; }
  .li .t b { display: block; font-size: 1.05rem; overflow-wrap: anywhere; }
  .li .t small { color: var(--a-muted); }
  .li .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .chip { display: inline-block; font-size: .78rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--a-bg); border: 1px solid var(--a-line); color: var(--a-muted); margin-left: 6px; vertical-align: middle; }
  .chip.on { color: var(--a-ok); border-color: color-mix(in srgb, var(--a-ok) 50%, var(--a-line)); }
  .chip.sale { color: var(--a-warn); border-color: color-mix(in srgb, var(--a-warn) 55%, var(--a-line)); }
  .chip.bad { color: var(--a-bad); }
  .catbar { display: flex; gap: 6px; flex-wrap: wrap; }
  .catbar button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--a-line); font-weight: 600; min-height: 24px; }
  .catbar button[aria-pressed="true"] { background: var(--a-gold); color: #1a1405; border-color: var(--a-gold); }
  .catbar button:focus-visible { outline: 3px solid var(--a-warn); }
  .subcard { background: var(--a-panel2); border: 1px solid var(--a-line); border-radius: 10px; padding: 14px; display: grid; gap: 12px; }
  .pick { display: grid; gap: 4px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); max-height: 260px; overflow: auto; padding: 4px; border: 1px solid var(--a-line); border-radius: 8px; background: var(--a-bg); }
  .pick label { display: flex; gap: 8px; align-items: center; padding: 6px 8px; cursor: pointer; border-radius: 6px; }
  .pick input { accent-color: var(--a-gold); width: 18px; height: 18px; }

  /* Önizleme (sitenin marka değişkenlerini kullanır) */
  .brandpv { --pv-bg: var(--bg); background: var(--bg); color: var(--text); border: 1px solid var(--a-line); border-radius: 12px; padding: 20px; display: grid; gap: 14px; }
  .brandpv .brush { justify-self: start; background: var(--accent2); color: #17130b; font: var(--f-display-w) 1.4rem/1.1 var(--f-display); padding: 7px 24px 8px 16px; transform: rotate(-1.5deg); clip-path: polygon(0 14%,2% 2%,55% 0,100% 8%,98% 34%,100% 70%,96% 100%,40% 96%,3% 100%,0 76%); }
  .brandpv .it { background: var(--surface); border: 1px solid color-mix(in srgb, var(--text) 16%, transparent); border-radius: 10px; padding: 14px; }
  .brandpv .it b { font: 700 1.3rem/1.1 var(--f-cond); }
  .brandpv .it p { color: color-mix(in srgb, var(--text) 64%, var(--bg)); font-family: var(--f-body); font-size: .95rem; }
  .brandpv .pr { color: var(--accent); font: 700 1.4rem var(--f-cond); }
  .brandpv .script { font: 400 2rem/1 var(--f-script); color: var(--accent2); }
  .brandpv .b1 { justify-self: start; background: var(--accent); color: #17130b; border-radius: 99px; padding: 11px 24px; font: 700 1.1rem var(--f-cond); }

  /* Modal */
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.7); display: grid; align-items: start; justify-items: center; overflow-y: auto; padding: 16px 12px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .modal .box { width: 100%; max-width: 640px; background: var(--a-panel); border: 1px solid var(--a-line); border-radius: 14px; margin-top: calc(env(safe-area-inset-top, 0px) + 8px); }
  .modal header { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--a-line); position: sticky; top: 0; background: var(--a-panel); border-radius: 14px 14px 0 0; z-index: 2; }
  .modal header h2 { font: 700 1.35rem/1.2 "Barlow Condensed", sans-serif; flex: 1; }
  .modal .body { padding: 20px; display: grid; gap: 16px; }
  .modal footer { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--a-line); flex-wrap: wrap; position: sticky; bottom: 0; background: var(--a-panel); border-radius: 0 0 14px 14px; }

  .qrbox { background: #fff; padding: 16px; border-radius: 12px; justify-self: start; }
  .qrbox canvas { display: block; width: min(300px, 70vw); height: auto; image-rendering: pixelated; }
.salepv { display: flex; flex-wrap: wrap; gap: 8px; }
  .salepv span { padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.2); font-size: 1.05rem; }
  .salepv s { opacity: .65; margin-right: 4px; } .salepv b { color: var(--a-accent, #f2a51d); }
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: #26231d; border-top: 1px solid rgba(255,255,255,.14); color: var(--a-muted); font-size: .95rem; }
  .savebar.dirty { background: #4a3300; color: #fff; border-top-color: #f2a51d; }
  .savebar .btn { min-width: 130px; min-height: 46px; font-weight: 700; }
  .savebar .btn:disabled { opacity: .45; cursor: default; }
  body { padding-bottom: 76px; }
  .toast { bottom: calc(86px + env(safe-area-inset-bottom, 0px)) !important; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--a-text); color: #1a1405; padding: 11px 18px; border-radius: 99px; font-weight: 600; z-index: 80; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 92vw; }

  @media (max-width: 640px) { .li { grid-template-columns: minmax(0, 1fr); } .li .acts { justify-content: flex-start; } .card { padding: 16px; } }
  @media (min-width: 900px) {
    .shell { grid-template-columns: 240px minmax(0, 1fr); }
    .side { position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--a-line); border-bottom: 0; display: flex; flex-direction: column; overflow-y: auto; }
    .side-top { padding: 20px 18px 8px; flex-wrap: wrap; }
    .status { margin-left: 0; width: 100%; }
    .tabs { flex-direction: column; padding: 12px; overflow: visible; }
    .tabs button { padding: 12px 14px; }
    .side-links { display: grid; gap: 8px; padding: 12px; margin-top: auto; }
    main.pane { padding: 32px 36px 100px; }
    .mob-links { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="off">
    <img src="assets/img/logo-mark.jpg" alt="">
    <h1>Yönetim Paneli</h1>
    <label class="f"><span>Şifre</span><input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn primary" type="submit">Giriş yap</button>
    <p class="hint" id="loginHint"></p>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <div class="savebar" id="savebar" role="region" aria-label="Kaydet"><span id="saveMsg" aria-live="polite">Tüm değişiklikler kaydedildi</span><button class="btn primary" id="saveBtn" type="button" disabled>Kaydet</button></div>
  <aside class="side">
    <div class="side-top">
      <img id="sLogo" src="assets/img/logo-mark.jpg" alt="">
      <b id="sName">Major Döner</b>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Panel bölümleri"></nav>
    <div class="side-links">
      <a class="btn" href="index.html" target="_blank" rel="noopener">Siteyi aç</a>
      <a class="btn" href="menu.html" target="_blank" rel="noopener">Menüyü aç</a>
      <button class="btn" id="logout" type="button">Çıkış yap</button>
    </div>
  </aside>
  <main class="pane" id="view"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="assets/core.js"></script>
<script src="assets/qr.js"></script>
<script>
(function () {
  'use strict';
  var M = Major, $ = function (id) { return document.getElementById(id); };
  var D = null, DRAFT = null, DRAFT_NEW = false, tab = 'genel', catSel = null, campEdit = null, armed = null, armTimer = null, saveTimer = null, qrUrlTouched = false;

  var TABS = [
    ['genel', 'Genel'], ['gorunum', 'Görünüm'], ['anasayfa', 'Ana sayfa'], ['menu', 'Menü ve ürünler'], ['kampanya', 'Kampanyalar'],
    ['icerik', 'Hakkımızda ve galeri'], ['iletisim', 'İletişim ve konum'], ['qr', 'QR kod'], ['yedek', 'Yedek ve güvenlik']
  ];
  var KINDS = [['wrap', 'Dürüm'], ['menu', 'Menü (dürüm + patates + içecek)'], ['plate', 'Servis tabağı'], ['salad', 'Salata'], ['can', 'Kutu içecek'], ['cup', 'Bardak (ayran, şalgam)'], ['bottle', 'Şişe (soda, su)']];
  var CAMP_TYPES = [['info', 'Sadece duyuru (fiyat değişmez)'], ['percent', 'Yüzde indirim'], ['amount', 'TL indirim']];

  /* ---------- Küçük yardımcılar ---------- */
  var esc = M.esc;
  function root(p) { return p.indexOf('draft.') === 0 ? { draft: DRAFT } : D; }
  function g(p) { return p.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, root(p)); }
  function setv(p, v) { var ks = p.split('.'), o = root(p); for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }
  function val(p) { var v = g(p); return v == null ? '' : v; }
  function toast(t) {
    var el = document.createElement('div'); el.className = 'toast'; el.textContent = t; $('toastRoot').appendChild(el);
    setTimeout(function () { el.remove(); }, 2600);
  }
  function inp(label, path, o) {
    o = o || {};
    var type = o.type || 'text';
    var attrs = 'type="' + type + '" data-path="' + path + '" value="' + esc(val(path)) + '"' + (o.num ? ' data-num="1" inputmode="decimal"' : '') + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + (o.step ? ' step="' + o.step + '"' : '') + (o.min != null ? ' min="' + o.min + '"' : '');
    return '<label class="f"><span>' + label + '</span><input ' + attrs + '>' + (o.help ? '<span class="help">' + o.help + '</span>' : '') + '</label>';
  }
  function area(label, path, o) {
    o = o || {};
    return '<label class="f"><span>' + label + '</span><textarea data-path="' + path + '"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + '>' + esc(val(path)) + '</textarea>' + (o.help ? '<span class="help">' + o.help + '</span>' : '') + '</label>';
  }
  function sw(label, path, rerender) {
    return '<label class="switch"><input type="checkbox" data-path="' + path + '"' + (g(path) ? ' checked' : '') + (rerender ? ' data-rerender="1"' : '') + '><span>' + label + '</span></label>';
  }
  function sel(label, path, opts, rerender) {
    return '<label class="f"><span>' + label + '</span><select data-path="' + path + '"' + (rerender ? ' data-rerender="1"' : '') + '>' + opts.map(function (o) {
      return '<option value="' + esc(o[0]) + '"' + (String(g(path)) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
    }).join('') + '</select></label>';
  }
  function imgField(label, path, o) {
    o = o || {}; var v = g(path);
    return '<div class="f"><span style="color:var(--a-text);font-weight:500">' + label + '</span><div class="imgbox"><div class="pv">' + (v ? '<img src="' + esc(v) + '" alt="">' : 'Görsel yok') + '</div><div class="btns">' +
      '<label class="btn sm file">Görsel seç<input type="file" accept="image/*" data-upload="' + path + '" data-max="' + (o.max || 1000) + '"></label>' +
      (v && !o.noRemove ? '<button type="button" class="btn sm danger" data-act="clear-img" data-path="' + path + '">Kaldır</button>' : '') +
      '</div></div>' + (o.help ? '<span class="help">' + o.help + '</span>' : '') + '</div>';
  }
  function ask(key) { // iki adımlı onay (tarayıcı confirm() penceresi açılmaz)
    if (armed === key) { armed = null; return true; }
    armed = key; clearTimeout(armTimer); armTimer = setTimeout(function () { armed = null; render(); }, 4000);
    return false;
  }
  function delBtn(key, act, extra, label) {
    var on = armed === key;
    return '<button type="button" class="btn sm danger' + (on ? ' arm' : '') + '" data-act="' + act + '" ' + (extra || '') + ' data-key="' + key + '">' + (on ? 'Emin misin? Sil' : (label || 'Sil')) + '</button>';
  }
  function catOf(id) { return D.categories.filter(function (c) { return c.id === id; })[0]; }
  function prodOf(id) { return D.products.filter(function (p) { return p.id === id; })[0]; }

  /* ---------- Kaydetme ---------- */
  function setStatus(t, cls) { var s = $('status'); s.textContent = t; s.className = 'status ' + (cls || ''); }
  var dirty = false, saving = false;
  function paintBar() {
    var bar = $('savebar'); if (!bar) return;
    bar.classList.toggle('dirty', dirty);
    $('saveMsg').textContent = saving ? 'Kaydediliyor…' : dirty ? 'Kaydedilmemiş değişiklikler var' : 'Tüm değişiklikler kaydedildi';
    $('saveBtn').disabled = saving || !dirty;
    $('saveBtn').textContent = saving ? 'Kaydediliyor…' : 'Kaydet';
  }
  function commit() { dirty = true; setStatus('Kaydedilmedi', 'bad'); paintBar(); }   // değişiklik yalnızca Kaydet'e basınca siteye yazılır
  function saveNow() {
    if (saving || !dirty) return;
    saving = true; paintBar();
    M.save(D).then(function () {
      dirty = false; saving = false; paintBar(); setStatus('Kaydedildi', 'ok');
      toast('Kaydedildi. Değişiklikler siteye uygulandı.');
    }).catch(function (e) {
      saving = false; paintBar();
      if (e && e.auth) { M.setToken(null); showLogin('Oturum süresi doldu. Tekrar giriş yapın. Kaydedilmemiş değişiklikler kaybolabilir.'); return; }
      setStatus('Kaydedilemedi', 'bad'); toast((e && e.message) || 'Kaydedilemedi. Tekrar deneyin.');
    });
  }
  addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && $('savebar')) { e.preventDefault(); saveNow(); } });

  /* ---------- Sekmeler ---------- */
  function T_genel() {
    return '<h1 class="pg-title">Genel</h1>' +
      '<div class="card"><h2>İşletme</h2>' + '<div class="grid2">' + inp('Site adı', 'settings.siteName') + inp('Kısa slogan (logo altı, alt bilgi)', 'settings.tagline') + '</div>' +

  function priceText(p, cat) {

  }

    return '<div class="li' + (p.visible ? '' : ' off') + '"><div class="t"><b>' + esc(p.name) +
      (p.onSale ? '<span class="chip sale">Kampanyalı</span>' : (camp.old ? '<span class="chip sale">Kampanya</span>' : '')) +
      (p.soldOut ? '<span class="chip bad">Tükendi</span>' : '') + (!p.visible ? '<span class="chip">Gizli</span>' : '') + '</b><small>' + priceText(p, cat) + '</small></div>' +
      '<div class="acts"><button class="btn sm" data-act="prod-edit" data-id="' + p.id + '">Düzenle</button>' +

        .catch(function (er) { $('loginErr').textContent = er.message; });
    } else {
      // Önizleme: "Major 123", "Major123" ve "major123" kabul edilir.
      if (pw.replace(/\s+/g, '').toLowerCase() === 'major123') { M.setToken('preview'); $('pw').value = ''; enter(); }
      else $('loginErr').textContent = 'Şifre yanlış. Tekrar deneyin.';
    }
  });
  $('saveBtn').addEventListener('click', saveNow);
  $('logout').addEventListener('click', function () { M.setToken(null); D = null; location.reload(); });

  M.load().then(function (d) {
    D = d;
    if (M.getToken()) enter(); else showLogin('');
  });
})();
</script>
</body>
</html>
