<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d0b">
<title>Major Döner | Çukurova, Adana</title>
<meta name="description" content="Major Döner, Adana Çukurova Güzelyalı. Tavuk dürüm ve menü. WhatsApp'tan sipariş verin.">
<link rel="icon" href="assets/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* Fikir: broşürdeki afiş enerjisi. Karanlık ocak başı, altın metal başlık, dönen şiş ve kayan amber şerit.
     Hareket tek yerde toplanır: hero (kor, şiş, başlık girişi). Alt bölümlerde hareket yalnızca kullanıcı etkileşiminde. */
  .gold-text {
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 40%, #fff) 0%, var(--accent) 48%, color-mix(in srgb, var(--accent) 55%, #000) 100%);
    -webkit-background-clip: text; background-clip: text; color: var(--accent); -webkit-text-fill-color: transparent;
  }
  @supports not (background-clip: text) { .gold-text { -webkit-text-fill-color: currentColor; } }

  /* ---------- HERO ---------- */
  .hero { position: relative; overflow: hidden; isolation: isolate; padding-block: 34px 120px; }
  #embers { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  .hero::before { content: ""; position: absolute; left: 50%; bottom: -46%; width: 130%; aspect-ratio: 1; transform: translateX(-50%); z-index: -2; pointer-events: none;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent2) 34%, transparent), color-mix(in srgb, var(--accent2) 8%, transparent) 55%, transparent 72%); animation: glow 4.5s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .65; transform: translateX(-50%) scale(.96); } to { opacity: 1; transform: translateX(-50%) scale(1.04); } }
  .hero-grid { display: grid; gap: 14px; align-items: center; }
  .kicker { font: 400 clamp(1.7rem, 6vw, 2.5rem)/1 var(--f-script); color: var(--accent2); animation: rise .8s .05s cubic-bezier(.2,.7,.2,1) both; }
  h1.title { font: 400 clamp(3.4rem, 15vw, 7.4rem)/.92 var(--f-poster); text-transform: uppercase; letter-spacing: -.005em; margin: 6px 0 10px; filter: drop-shadow(0 5px 0 rgba(0,0,0,.5)); }
  h1.title .ln { display: block; overflow: hidden; padding: .1em .04em 0; margin-top: -.1em; }
  h1.title .ln > span { display: block; animation: rise .95s cubic-bezier(.2,.7,.2,1) both; }
  h1.title .ln:nth-child(2) > span { animation-delay: .14s; }
  @keyframes rise { from { transform: translateY(105%); opacity: 0; } to { transform: none; opacity: 1; } }
  .slogan { display: inline-block; position: relative; font: 400 clamp(2.1rem, 7vw, 3.2rem)/1.05 var(--f-script); color: var(--text); transform: rotate(-2deg); transform-origin: left; padding-bottom: 14px; animation: rise .9s .35s cubic-bezier(.2,.7,.2,1) both; }
  .slogan svg { position: absolute; left: -2%; bottom: 0; width: 104%; height: 16px; overflow: visible; }
  .slogan path { stroke: var(--accent2); stroke-width: 6; stroke-linecap: round; fill: none; stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw .9s .95s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .hero p.lead { color: var(--muted); font-size: 1.15rem; max-width: 32ch; margin-top: 14px; animation: rise .8s .55s cubic-bezier(.2,.7,.2,1) both; }
  .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; animation: rise .8s .7s cubic-bezier(.2,.7,.2,1) both; }

  /* Dönen döner: assets/doner.js tuvale çizer (tavuk döner dokusu silindire sarılıp döner). */
  .spit-wrap { display: grid; place-items: center; min-height: 360px; position: relative; animation: rise 1s .25s cubic-bezier(.2,.7,.2,1) both; }
  .spit { position: relative; width: 230px; height: 372px; will-change: transform; }
  .spit .crown { position: absolute; top: 0; left: 50%; width: 92px; transform: translateX(-50%); z-index: 3; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); animation: bob 3.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateX(-50%) translateY(-5px); } }
  .spit canvas { position: absolute; left: 0; top: 46px; width: 230px; height: 300px; z-index: 1; filter: drop-shadow(0 18px 22px rgba(0,0,0,.55)); }
  .spit .heat { position: absolute; bottom: -4px; left: 50%; width: 260px; height: 60px; transform: translateX(-50%); z-index: 0; border-radius: 50%;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent2) 70%, transparent), transparent); filter: blur(6px); animation: glow2 1.7s ease-in-out infinite alternate; }
  @keyframes glow2 { from { opacity: .55; } to { opacity: 1; } }
  .spit-wrap .plaque { width: 100%; max-width: 540px; }
  .hero-grid.solo { grid-template-columns: 1fr !important; }

  /* ---------- Kayan şerit ---------- */
  .ribbon-wrap { position: relative; z-index: 4; overflow: hidden; margin-top: -78px; padding-block: 26px 22px; pointer-events: none; }
  .ribbon-wrap .ribbon { pointer-events: auto; }
  .ribbon { position: relative; margin: 0 -24px; transform: rotate(-1.6deg); background: var(--accent2); color: var(--ink); border-block: 3px solid var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,.45); overflow: hidden; }
  .ribbon .track { display: flex; width: max-content; animation: mq 30s linear infinite; }
  .ribbon:hover .track { animation-play-state: paused; }
  .ribbon .it { display: inline-flex; align-items: center; gap: 22px; padding: 11px 0 11px 22px; font: 400 clamp(1.2rem, 3.6vw, 1.7rem)/1 var(--f-poster); text-transform: uppercase; white-space: nowrap; }
  .ribbon .it svg { width: 24px; height: 24px; }
  @keyframes mq { to { transform: translateX(-50%); } }

  section.block { padding-block: 84px; position: relative; }
  .sec-title { font: 400 clamp(2rem, 6.2vw, 3.4rem)/1.04 var(--f-poster); text-transform: uppercase; margin-bottom: 18px; }
  .sec-title em { font: inherit; font-style: normal; color: var(--accent2); }
  .lead2 { color: var(--muted); max-width: 46ch; }

  /* ---------- Boy seçici ---------- */
  .size-grid { display: grid; gap: 30px; align-items: center; }
  .seg { display: inline-flex; gap: 8px; margin: 22px 0 8px; flex-wrap: wrap; }
  .seg button { all: unset; cursor: pointer; box-sizing: border-box; min-height: 52px; padding: 0 22px; display: grid; place-items: center; border-radius: 14px; border: 1.5px solid var(--line); font: 700 1.2rem/1 var(--f-cond); letter-spacing: .02em; transition: background .2s, color .2s, border-color .2s, transform .15s; }
  .seg button small { display: block; font: 500 .85rem/1 var(--f-cond); color: var(--muted); margin-top: 3px; text-align: center; }
  .seg button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--ink); }
  .seg button[aria-checked="true"] small { color: color-mix(in srgb, var(--ink) 70%, var(--accent)); }
  .seg button:active { transform: scale(.96); }
  .seg button:focus-visible { outline: 3px solid var(--accent2); outline-offset: 3px; }
  .gram { font: 400 clamp(3rem, 12vw, 5rem)/1 var(--f-poster); color: var(--accent2); font-variant-numeric: tabular-nums; }
  .gram span { font-size: .4em; margin-left: 6px; color: var(--muted); }
  .stage { position: relative; min-height: 340px; display: grid; place-items: center; border-radius: 22px; overflow: hidden; border: 1px solid var(--line);
    background: radial-gradient(closest-side at 50% 60%, color-mix(in srgb, var(--accent2) 22%, var(--surface)), var(--surface)); }
  .stage .ruler { position: absolute; inset: auto 18px 16px; height: 8px; background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 14px); }
  .stage .shadow { position: absolute; bottom: 52px; width: 56%; height: 22px; border-radius: 50%; background: rgba(0,0,0,.55); filter: blur(10px); transition: transform .5s cubic-bezier(.3,1.4,.4,1); }
  .stage .wr { width: min(400px, 92%); transition: transform .55s cubic-bezier(.3,1.5,.4,1); }
  .stage svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 14px 14px rgba(0,0,0,.4)); }

  /* ---------- Sipariş adımları ---------- */
  .steps { list-style: none; margin: 34px 0 0; padding: 0; display: grid; gap: 0; counter-reset: s; --n: 3; }
  .steps li { position: relative; padding: 0 0 34px 74px; counter-increment: s; }
  .steps li:last-child { padding-bottom: 0; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--accent2); color: var(--ink); font: 400 1.5rem/1 var(--f-poster); z-index: 1; }
  .steps li::after { content: ""; position: absolute; left: 25px; top: 52px; bottom: 0; width: 2px; background: linear-gradient(var(--accent2), var(--line)); transform-origin: top; transform: scaleY(var(--p, 1)); }
  .steps li:last-child::after { display: none; }
  .steps b { display: block; font: 700 1.5rem/1.15 var(--f-cond); letter-spacing: .01em; margin: 6px 0 4px; }
  .steps span { color: var(--muted); display: block; max-width: 40ch; }

  /* ---------- Hakkımızda ---------- */
  .about-grid { display: grid; gap: 40px; }
  .about p { color: var(--muted); max-width: 56ch; }
  .about p + p { margin-top: 14px; }
  .tilt { perspective: 900px; }
  .plaque { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: 0 34px 60px -26px color-mix(in srgb, var(--accent) 50%, #000), 0 0 0 6px color-mix(in srgb, var(--accent) 8%, transparent); background: #2a2824; transform-style: preserve-3d; transition: transform .25s ease-out; will-change: transform; }
  .plaque img { width: 100%; height: auto; aspect-ratio: 1440 / 1053; object-fit: cover; }
  .plaque::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 38%, rgba(255,240,200,.34) 50%, transparent 62%); transform: translateX(-120%); transition: transform 1.1s ease; pointer-events: none; }
  .plaque:hover::after { transform: translateX(120%); }
  .feat { list-style: none; margin: 26px 0 0; padding: 0; border-top: 1px solid var(--line); }
  .feat li { padding: 15px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 28px 1fr; gap: 3px 14px; }
  .feat .ic { color: var(--accent); margin-top: 3px; }
  .feat b { font: 700 1.25rem/1.2 var(--f-cond); letter-spacing: .02em; }
  .feat span { grid-column: 2; color: var(--muted); }

  /* ---------- Galeri ---------- */
  .gal { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px var(--gutter-r) 18px var(--gutter); margin-inline: calc(var(--gutter) * -1) calc(var(--gutter-r) * -1); scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
  .gal figure { margin: 0; flex: 0 0 min(78%, 420px); scroll-snap-align: center; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); position: relative; cursor: zoom-in; }
  .gal img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .gal figure:hover img { transform: scale(1.07); }
  .gal figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 14px 12px; background: linear-gradient(transparent, rgba(0,0,0,.75)); font: 600 1.05rem var(--f-cond); letter-spacing: .02em; }

  /* ---------- Kampanyalar (yalnızca kampanya kartı, ürün listesi yok) ---------- */
  .kgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); margin-top: 8px; }
  .kc { display: grid; grid-template-rows: auto 1fr; border-radius: 18px; overflow: hidden; text-decoration: none; background: linear-gradient(135deg, var(--accent2), color-mix(in srgb, var(--accent2) 58%, #7a2d00)); color: var(--ink); transition: transform .25s, box-shadow .25s; }
  @media (hover: hover) { .kc:hover { transform: translateY(-4px); box-shadow: 0 24px 40px -20px rgba(0,0,0,.8); } }
  .kc .im { aspect-ratio: 16 / 9; background: rgba(23,19,11,.18); display: grid; place-items: center; overflow: hidden; }
  .kc .im img { width: 100%; height: 100%; object-fit: cover; }
  .kc .im .ic { color: rgba(23,19,11,.55); }
  .kc .kb { padding: 16px 18px 18px; display: grid; gap: 6px; align-content: start; }
  .kc .bd { justify-self: start; font: 700 .95rem/1 var(--f-cond); letter-spacing: .03em; background: var(--ink); color: var(--accent2); padding: 5px 10px; border-radius: 6px; }
  .kc h3 { font: 400 1.5rem/1.1 var(--f-poster); }
  .kc p { font-weight: 500; }
  .kc .pr { display: flex; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .kc .pr strong { font: 400 2rem/1 var(--f-poster); }
  .kc .pr s { font: 600 1.2rem var(--f-cond); opacity: .7; }

  /* ---------- Menü çağrısı ---------- */
  .menu-band { overflow: hidden; background: linear-gradient(180deg, var(--bg), color-mix(in srgb, var(--accent2) 14%, var(--bg)) 55%, var(--bg)); }
  .menu-band .wrap { display: grid; gap: 14px; justify-items: center; text-align: center; }
  .menu-band .lead2 { margin-inline: auto; }
  .menu-band .btn { min-height: 60px; padding-inline: 38px; font-size: 1.3rem; margin-top: 8px; }

  /* ---------- İletişim ---------- */
  .contact-grid { display: grid; gap: 30px; }
  .phone-big { font: 400 clamp(2.2rem, 9vw, 3.6rem)/1 var(--f-poster); letter-spacing: .01em; text-decoration: none; display: inline-block; margin-bottom: 20px; }
  .info { display: grid; gap: 14px; margin-top: 26px; }
  .info > div { display: grid; grid-template-columns: 26px 1fr; gap: 12px; color: var(--muted); }
  .info .ic { color: var(--accent); margin-top: 3px; }
  .info b { color: var(--text); font-weight: 600; }
  .hours { display: grid; grid-template-columns: auto 1fr; gap: 2px 18px; }
  .hours dt { color: var(--text); } .hours dd { margin: 0; }
  .map { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); min-height: 300px; }
  .map iframe { width: 100%; height: 100%; min-height: 340px; border: 0; display: block; }
  .map-empty { min-height: 300px; display: grid; place-content: center; gap: 14px; text-align: center; padding: 24px; color: var(--muted); }
  .map-empty .btn { justify-self: center; }

  footer.site { border-top: 1px solid var(--line); padding-block: 40px 130px; text-align: center; color: var(--muted); font-size: .95rem; }
  footer.site .script { font: 400 2.2rem/1 var(--f-script); color: var(--accent2); display: block; margin-bottom: 10px; }

  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: 1fr 1.5fr 1fr; gap: 8px; padding: 10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter); background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  .dock .btn { min-height: 46px; padding: 0 8px; font-size: 1.05rem; }
  header.site { transition: background .3s, box-shadow .3s; }
  header.site.scrolled { background: color-mix(in srgb, var(--bg) 96%, transparent); box-shadow: 0 8px 24px rgba(0,0,0,.4); }

  /* Kaydırınca belirme: yalnızca bu bölümlerde, ve yalnızca JS çalışıyorsa */
  html.anim .rv:not(.in) { opacity: 0; transform: translateY(26px); }
  .rv { transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
  html.anim .rv.d1 { transition-delay: .1s; } html.anim .rv.d2 { transition-delay: .2s; }

  @media (min-width: 820px) {
    .hero { padding-block: 70px 150px; }
    .hero-grid { grid-template-columns: 1.25fr 1fr; gap: 30px; }
    .spit-wrap { min-height: 500px; } .spit { transform: scale(1.25); }
    .size-grid { grid-template-columns: 1fr 1fr; gap: 64px; }
    .about-grid { grid-template-columns: 1fr 1.05fr; gap: 70px; align-items: center; }
    .steps { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 28px; }
    .steps li { padding: 78px 0 0; }
    .steps li::after { left: 62px; right: -28px; top: 25px; bottom: auto; width: auto; height: 2px; transform-origin: left; transform: scaleX(var(--p, 1)); background: linear-gradient(90deg, var(--accent2), var(--line)); }
    .gal { overflow: visible; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .gal figure { flex: none; }
    .contact-grid { grid-template-columns: 1fr 1.1fr; gap: 60px; }
    .dock { display: none; }
    footer.site { padding-bottom: 50px; }
  }
  @media (max-width: 819px) { .spit-wrap { margin-top: 6px; } .spit { transform: scale(.82); margin: -30px 0; } }
  @media (max-width: 420px) { .brand .wm { font-size: .98rem; } }
  @media (prefers-reduced-motion: reduce) { .spit .tex, .ribbon .track { animation: none !important; } html.anim .rv:not(.in) { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="topbar" hidden></div>
<header class="site" id="hdr">
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="Ana sayfa"><img id="brandLogo" src="assets/img/logo-mark.jpg" alt="" width="44" height="44"><span class="wm" id="brandName">MAJOR DÖNER</span></a>
    <nav class="links" aria-label="Bölümler" id="nav">
      <a href="#boy" data-sec="boy">Boyutlar</a><a href="#kampanya" data-sec="kampanya">Kampanyalar</a><a href="#siparis" data-sec="siparis">Sipariş</a><a href="#hakkimizda" data-sec="hakkimizda">Hakkımızda</a><a href="#galeri" data-sec="galeri">Galeri</a><a href="#iletisim" data-sec="iletisim">İletişim</a>
    </nav>
    <a class="btn btn-gold btn-sm menu-btn" href="menu.html" style="margin-left:auto">Menüyü Gör</a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <canvas id="embers" aria-hidden="true"></canvas>
    <div class="wrap hero-grid" id="heroGrid">
      <div class="hero-text">
        <div class="kicker" id="tagline">Majör Lezzetiyle</div>
        <h1 class="title gold-text" id="title"><span class="ln"><span>Major</span></span><span class="ln"><span>Döner</span></span></h1>
        <div class="slogan" id="slogan">İyi döner, iyi mood!<svg viewBox="0 0 300 16" preserveAspectRatio="none" aria-hidden="true"><path d="M3 11 C 60 3, 120 14, 190 7 S 280 6, 297 9"/></svg></div>
        <p class="lead" id="heroText"></p>
        <div class="cta-row">
          <a class="btn btn-gold menu-btn" href="menu.html">Menüyü Gör</a>
          <a class="btn btn-wa" id="heroWa" href="#" target="_blank" rel="noopener"></a>
          <a class="btn btn-line" id="heroCall" href="#"></a>
        </div>
      </div>
      <div class="spit-wrap" id="heroVis" aria-hidden="true"></div>
    </div>
  </section>

  <div class="ribbon-wrap"><div class="ribbon" aria-hidden="true"><div class="track" id="track"></div></div></div>

  <section class="block" id="boy">
    <div class="wrap size-grid">
      <div class="rv">
        <h2 class="sec-title" id="sizeTitle"></h2>
        <p class="lead2" id="sizeText"></p>
        <div class="seg" id="seg" role="radiogroup" aria-label="Boy seç"></div>
        <div class="gram" aria-live="polite"><span style="margin:0;font-size:inherit;color:inherit" id="gram">150</span><span>g</span></div>
        <div style="margin-top:20px"><a class="btn btn-line" id="sizeBtn" href="menu.html"></a></div>
      </div>
      <div class="stage rv d1" aria-hidden="true"><div class="shadow" id="shadow"></div><div class="wr" id="wr"></div><div class="ruler"></div></div>
    </div>
  </section>

  <section class="block" id="kampanya" style="padding-top:20px" hidden>
    <div class="wrap">
      <h2 class="sec-title rv" id="kampTitle">Kampanyalar</h2>
      <div class="kgrid" id="kgrid"></div>
    </div>
  </section>

  <section class="block" id="siparis" style="background:color-mix(in srgb,var(--surface) 55%,var(--bg))">
    <div class="wrap">
      <h2 class="sec-title rv" id="stepsTitle"></h2>
      <ol class="steps" id="steps"></ol>
    </div>
  </section>

  <section class="block about" id="hakkimizda">
    <div class="wrap about-grid">
      <div class="tilt rv" id="tilt"><div class="plaque" id="plaque"><img id="heroImg" src="assets/img/logo.jpg" alt="Major Döner logosu" width="1440" height="1053" loading="lazy"></div></div>
      <div class="rv d1">
        <h2 class="sec-title" id="aboutTitle" style="font-size:clamp(1.8rem,5vw,2.8rem)"></h2>
        <div id="aboutText"></div>
        <ul class="feat" id="features"></ul>
      </div>
    </div>
  </section>

  <section class="block" id="galeri" style="padding-top:20px">
    <div class="wrap">
      <h2 class="sec-title rv" id="galTitle">Fotoğraflar</h2>
      <div class="gal" id="gallery"></div>
    </div>
  </section>

  <section class="block menu-band" id="band">
    <div class="wrap rv">
      <h2 class="sec-title" id="bandTitle"></h2>
      <p class="lead2" id="bandText"></p>
      <a class="btn btn-gold" id="bandBtn" href="menu.html"></a>
    </div>
  </section>

  <section class="block" id="iletisim">
    <div class="wrap contact-grid">
      <div class="rv">
        <h2 class="sec-title" id="contactTitle">Bize ulaş</h2>
        <a class="phone-big gold-text" id="phoneBig" href="#"></a>
        <div class="cta-row" style="margin-top:0;animation:none">
          <a class="btn btn-wa" id="cWa" href="#" target="_blank" rel="noopener"></a>
          <a class="btn btn-line" id="cCall" href="#"></a>
        </div>
        <div class="info" id="info"></div>
      </div>
      <div class="map rv d1" id="map"></div>
    </div>
  </section>
</main>

    // boy seçici
    $('sizeTitle').innerHTML = M.rich(ct.size.title); $('sizeText').textContent = ct.size.text; $('sizeBtn').textContent = ct.size.button;
    var hasSizes = d.categories.some(function (x) { return x.sizes && x.sizes.length; });

        (k.badge ? '<span class="bd">' + M.esc(k.badge) + '</span>' : '') + '<h3>' + M.esc(k.title) + '</h3>' + (k.description ? '<p>' + M.esc(k.description) + '</p>' : '') +
        (k.price != null ? '<div class="pr">' + (k.oldPrice ? '<s>' + M.fmt(k.oldPrice) + '</s>' : '') + '<strong>' + M.fmt(k.price) + '</strong></div>' : '') + '</div></a>';
    }).join('');

    // sipariş adımları

    show('siparis', st.show && sitems.length > 0);

    $('aboutText').innerHTML = String(a.text || '').split(/\n{2,}/).map(function (p) { return '<p>' + M.esc(p).replace(/\n/g, '<br>') + '</p>'; }).join('');
    $('features').innerHTML = (a.features || []).filter(function (f) { return f.t || f.d; }).map(function (f) {
      return '<li>' + M.icon('crown', 24) + '<b>' + M.esc(f.t) + '</b><span>' + M.esc(f.d) + '</span></li>';

    show('hakkimizda', ct.aboutShow);

    // galeri
    $('galTitle').textContent = ct.galleryTitle;
    var g = (a.gallery || []).filter(function (x) { return x && x.src; });

    if (c.instagram) info += '<div>' + M.icon('insta') + '<span><b>Instagram</b><br><a href="' + M.esc(c.instagram) + '" target="_blank" rel="noopener">' + M.esc(c.instagram.replace(/^https?:\/\/(www\.)?/, '')) + '</a></span></div>';

  /* ---------- Boy seçici (fiyat yok, sadece boy ve gramaj) ---------- */
  function sizePicker(d) {
    var cat = d.categories.filter(function (c) { return c.sizes && c.sizes.length; })[0];
    var sizes = cat.sizes, scales = [0.66, 0.86, 1.04], cur = Math.min(1, sizes.length - 1);
    $('wr').innerHTML = M.art('wrap');
    function grams(i) { var n = parseInt(String(sizes[i].sub).replace(/\D/g, ''), 10); return isNaN(n) ? 0 : n; }
    function showSize(i, animate) {
      cur = i;
      [].forEach.call($('seg').children, function (b, j) { b.setAttribute('aria-checked', String(j === i)); b.tabIndex = j === i ? 0 : -1; });
      $('wr').style.transform = 'scale(' + (scales[i] || 1) + ') rotate(' + (i - 1) * 3 + 'deg)';
      $('shadow').style.transform = 'scaleX(' + (scales[i] || 1) + ')';
      var from = +$('gram').textContent || 0, to = grams(i);
      if (!animate || reduce || !to) { $('gram').textContent = to || ''; return; }
      var t0 = performance.now();
      (function tick(t) { var p = Math.min(1, (t - t0) / 420); $('gram').textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); })(t0);
    }
    $('seg').innerHTML = sizes.map(function (s, i) { return '<button type="button" role="radio" data-i="' + i + '">' + M.esc(s.label) + '<small>' + M.esc(s.sub) + '</small></button>'; }).join('');
    $('seg').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) showSize(+b.dataset.i, true); });
    $('seg').addEventListener('keydown', function (e) {
      var k = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!k) return;
      e.preventDefault(); var n = (cur + k + sizes.length) % sizes.length; showSize(n, true); $('seg').children[n].focus();
    });
    showSize(cur, false);
  }

  /* ---------- Hareket ve etkileşimler ---------- */
  function boot() {
    var hdr = $('hdr');
    function onScroll() { hdr.classList.toggle('scrolled', window.scrollY > 24); }
    addEventListener('scroll', onScroll, { passive: true }); onScroll();

    var rv = [].slice.call(document.querySelectorAll('.rv'));
    if ('IntersectionObserver' in window && !reduce) {
      document.documentElement.classList.add('anim');
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }); }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      rv.forEach(function (el) { io.observe(el); });
      setTimeout(function () { rv.forEach(function (el) { var r = el.getBoundingClientRect(); if (r.top < innerHeight) el.classList.add('in'); }); }, 900);
    }

    var steps = [].slice.call(document.querySelectorAll('#steps li'));
    function lines() {
      steps.forEach(function (li) {
        var r = li.getBoundingClientRect(), p = (innerHeight * 0.8 - r.top) / Math.max(120, r.height);
        li.style.setProperty('--p', Math.max(0, Math.min(1, p)).toFixed(3));
      });
    }
    var spit = $('spit1');
    function par() { if (reduce || !spit) return; var y = Math.min(scrollY, 700); spit.style.translate = '0 ' + (y * 0.12).toFixed(1) + 'px'; }
    var tick = false;
    addEventListener('scroll', function () { if (tick) return; tick = true; requestAnimationFrame(function () { par(); lines(); tick = false; }); }, { passive: true });
    lines();

    var tilt = $('tilt'), pl = $('plaque');
    if (!reduce && matchMedia('(hover:hover)').matches) {
      tilt.addEventListener('pointermove', function (e) { var r = tilt.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; pl.style.transform = 'rotateY(' + (x * 9).toFixed(2) + 'deg) rotateX(' + (-y * 7).toFixed(2) + 'deg)'; });
      tilt.addEventListener('pointerleave', function () { pl.style.transform = ''; });
    }

    var gal = $('gallery');
    gal.addEventListener('click', function (e) { var f = e.target.closest('figure'); if (f) { var im = f.querySelector('img'); M.zoomImage(im.src, im.alt); } });
    gal.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('figure')) { e.preventDefault(); var im = e.target.querySelector('img'); M.zoomImage(im.src, im.alt); } });
    // plaka da tıklanınca büyür
    pl.classList.add('zoomable'); pl.addEventListener('click', function () { var im = pl.querySelector('img'); M.zoomImage(im.src, im.alt); });

    embers();
  }

  /* ---------- Kor tanecikleri (hero) ---------- */
  function embers() {
    var cv = $('embers'); if (!cv || reduce) return;
    var ctx = cv.getContext('2d'), dpr = Math.min(2, devicePixelRatio || 1), W = 0, H = 0, P = [], run = true;
    function size() { var r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
    function mk(init) { return { x: Math.random() * W, y: init ? Math.random() * H : H + 10, r: .8 + Math.random() * 2.2, v: .25 + Math.random() * .8, sw: Math.random() * 6.28, a: .35 + Math.random() * .6 }; }
    size(); var n = W < 600 ? 26 : 46; for (var i = 0; i < n; i++) P.push(mk(true));
    addEventListener('resize', size);
    var vis = new IntersectionObserver(function (es) { run = es[0].isIntersecting; if (run) loop(); }); vis.observe(cv);
    var col = getComputedStyle(document.documentElement).getPropertyValue('--accent2').trim() || '#f2a51d';
    function loop() {
      if (!run) return;
      ctx.clearRect(0, 0, W, H);
      P.forEach(function (p, i) {
        p.y -= p.v; p.sw += .02; p.x += Math.sin(p.sw) * .35;
        var life = p.y / H; if (p.y < -10) P[i] = mk(false);
        ctx.globalAlpha = Math.max(0, Math.min(1, life * 1.4)) * p.a;
        ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
      });
      requestAnimationFrame(loop);
    }
    loop();
  }
})();
